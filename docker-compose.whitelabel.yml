# GetCito — whitelabel (Auth0 SSO) deploy, built from source.
#
# Usage:
#   cp .env.whitelabel.example .env
#   docker compose -f docker-compose.whitelabel.yml build
#   docker compose -f docker-compose.whitelabel.yml up -d

services:
  postgres:
    # Existing PostgreSQL 16 installs must keep this pin until their data has
    # been dumped and restored into PostgreSQL 18.
    image: postgres:${POSTGRES_IMAGE_TAG:-18-alpine}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: getcito
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      start_period: 30s

  db-migrate:
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/getcito
    depends_on:
      postgres:
        condition: service_healthy

  web:
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        DEPLOYMENT_MODE: whitelabel
        VITE_DEPLOYMENT_MODE: whitelabel
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_ICON: ${VITE_APP_ICON}
        VITE_APP_URL: ${VITE_APP_URL}
        VITE_APP_PARENT_NAME: ${VITE_APP_PARENT_NAME}
        VITE_APP_PARENT_URL: ${VITE_APP_PARENT_URL}
        VITE_OPTIMIZATION_URL_TEMPLATE: ${VITE_OPTIMIZATION_URL_TEMPLATE}
        VITE_ONBOARDING_REDIRECT_URL_TEMPLATE: ${VITE_ONBOARDING_REDIRECT_URL_TEMPLATE}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_APP_TIMEZONE: ${VITE_APP_TIMEZONE:-}
        VITE_APP_LOCALE: ${VITE_APP_LOCALE:-}
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  worker:
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
